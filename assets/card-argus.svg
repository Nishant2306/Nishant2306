<svg width="420" height="320" viewBox="0 0 420 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Argus — LLM Evaluation Platform. End-to-end tracing for multi-step LLM chains; auto-mines prod traces into eval sets via HDBSCAN + LLM labeling — 143 cases at 92% precision. 80-case adversarial benchmark, six-flag safety judge &amp; paired McNemar CI gate flagged every injected regression pre-merge; root-cause analyzer at 81% accuracy.">
