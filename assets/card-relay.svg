<svg width="420" height="320" viewBox="0 0 420 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Relay — LLM Cost Gateway. OpenAI-compatible gateway with local-embedding semantic caching (95% hit rate, 2.5% false hits) and complexity-based routing — 91% less simulated API spend over 67k requests. Lua token buckets, per-team budgets &amp; circuit-breaker failover held zero dropped requests through outage drills at 3.6 ms p50 overhead.">
