name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Snake and dot ramps match the portfolio palette at nishcodes.com:
      # dark  — violet #7850ff ramp climbing to mint #00ffc8 on #09090b
      # light — teal ramp on #f5f5f0 with the light-theme violet #5a30cc snake
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%235a30cc&color_dots=%23f5f5f0,%23cdebe1,%237fd9bf,%232bb894,%2300997a
            dist/github-snake-dark.svg?color_snake=%2300ffc8&color_dots=%2309090b,%231f1147,%233b2585,%235b39d6,%237850ff

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
